name: eJP newswire

# Lives in this repo rather than its own because SLACK_GIFTS and SLACK_WWW are already
# here, and GitHub secrets are write-only — there is no way to copy them to a new repo
# without the plaintext values, which nobody has.

on:
  # Fired every 15 minutes by an Apps Script trigger on Google's servers (see
  # newswire/pinger.gs). The schedule below is a fallback only, and a weak one.
  #
  # Measured over 27 consecutive scheduled runs while this asked for hourly: median gap
  # 4.2 hours, worst 6.6. GitHub queues cron on a private repo and drops what it cannot
  # place, so the request is a hint, not a promise, and asking hourly bought a four-hour
  # digest. Asking every 15 minutes is not expected to be honoured either — it is set
  # here because more attempts can only land more often, never fewer, and it costs
  # nothing extra: a run with nothing fresh reads its state, finds no new items and
  # exits. Real cadence comes from the pinger.
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: ejp-newswire
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: newswire
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - run: python poll.py
        env:
          SLACK_GIFTS: ${{ secrets.SLACK_GIFTS }}
          SLACK_WWW: ${{ secrets.SLACK_WWW }}
          # Health findings only, never stories — see _housekeeping in poll.py. Optional:
          # with this unset, findings stay in status.json and a critical one still fails
          # the run, which is what sends GitHub's own email to the repo owner.
          SLACK_HEALTH: ${{ secrets.SLACK_HEALTH }}
          # The judge's rescue pass. Absent, the newswire runs keyword-only, which is
          # the intended degraded mode rather than a failure.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Used only to put the status.json URL in a health message.
          GITHUB_REPOSITORY: ${{ github.repository }}

      # There is deliberately no git step here. poll.py commits and pushes its own state
      # through state.record(), which unions against origin first and, on a lost push
      # race, points the branch at origin without disturbing the tree.
      #
      # The step that used to live here did the same job a second time with
      # `git pull --rebase --autostash`. Two committers writing the same files in one job
      # is how a stale index snapshots an old tree and silently deletes work that is
      # already on origin, and --autostash is the specific mechanism that has lost
      # uncommitted work in this org before. One writer, and it is the one that merges.

      # Runs on failure too: status.json explains the break, and it is the only thing
      # that will after the fact.
      - if: always()
        run: python poll.py --status
