name: eJP newswire

# Lives in this repo rather than its own because SLACK_GIFTS and SLACK_WWW are already
# here, and GitHub secrets are write-only — there is no way to copy them to a new repo
# without the plaintext values, which nobody has.

on:
  # Fired every 15 minutes by an Apps Script trigger on Google's servers (see
  # newswire/pinger.gs). GitHub's own cron has been measured on this repo dropping whole
  # days and once firing 11.6 hours late; the schedule below is an hourly fallback only.
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: ejp-newswire
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: newswire
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - run: python poll.py
        env:
          SLACK_GIFTS: ${{ secrets.SLACK_GIFTS }}
          SLACK_WWW: ${{ secrets.SLACK_WWW }}

      # There is deliberately no git step here. poll.py commits and pushes its own state
      # through state.record(), which unions against origin first and, on a lost push
      # race, points the branch at origin without disturbing the tree.
      #
      # The step that used to live here did the same job a second time with
      # `git pull --rebase --autostash`. Two committers writing the same files in one job
      # is how a stale index snapshots an old tree and silently deletes work that is
      # already on origin, and --autostash is the specific mechanism that has lost
      # uncommitted work in this org before. One writer, and it is the one that merges.

      # Runs on failure too: status.json explains the break, and it is the only thing
      # that will after the fact.
      - if: always()
        run: python poll.py --status
