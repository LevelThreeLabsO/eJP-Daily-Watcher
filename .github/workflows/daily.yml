name: Daily Phil watchers

on:
  workflow_dispatch:
  schedule:
    # 09:15 UTC ≈ 5:15am ET — lands before the Daily Phil is assembled.
    - cron: "15 9 * * 1-5"

permissions:
  contents: write

concurrency:
  group: dailyphil
  cancel-in-progress: false

jobs:
  gifts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python src/gifts.py --days=1 --post
        env:
          SLACK_GIFTS: ${{ secrets.SLACK_GIFTS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  events:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python src/events.py --post
        env:
          SLACK_WWW: ${{ secrets.SLACK_WWW }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Persist seen-state
        run: |
          git config user.name "dailyphil-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A data/ || true
          git diff --staged --quiet || git commit -m "state: $(date -u +%F)"
          git push || true
