name: Daily Phil watchers

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the digest to the log without posting to Slack"
        type: boolean
        default: true
  schedule:
    # GitHub silently drops scheduled runs under load, and :00/:15/:30 are the
    # worst minutes for it — 27 Aug never fired at all. Odd minutes, plus a backup
    # 50 minutes later. The posted-today guard below stops the backup double-posting.
    - cron: "37 9 * * 1-5"    # ~5:37am ET
    - cron: "23 10 * * 1-5"   # backup, ~6:23am ET

permissions:
  contents: write

concurrency:
  group: dailyphil
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt

      - name: Skip if today's digest already went out
        id: guard
        run: |
          TODAY=$(date -u +%F)
          if [ -f data/last_posted.txt ] && [ "$(cat data/last_posted.txt)" = "$TODAY" ] \
             && [ "${{ inputs.dry_run }}" != "true" ]; then
            echo "already posted $TODAY — skipping"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Collect candidates
        if: steps.guard.outputs.skip != 'true' 
        run: python src/feeds.py

      - name: Sort into sections and post
        if: steps.guard.outputs.skip != 'true'
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python src/digest.py --preview
          else
            python src/digest.py --post
          fi
        env:
          SLACK_GIFTS: ${{ secrets.SLACK_GIFTS }}
          SLACK_WWW: ${{ secrets.SLACK_WWW }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_DAILY_BUDGET: "10"

      - name: Persist state
        if: always()
        run: |
          if [ "${{ inputs.dry_run }}" != "true" ] && [ "${{ steps.guard.outputs.skip }}" != "true" ]; then
            date -u +%F > data/last_posted.txt
          fi
          git config user.name "dailyphil-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ || true
          git diff --staged --quiet || git commit -m "state: $(date -u +%F)"
          git pull --rebase --autostash -q || true
          git push || true
