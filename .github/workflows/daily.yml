name: Daily Phil watchers

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the digest to the log without posting to Slack"
        type: boolean
        default: true
  schedule:
    # Target delivery is 6:00am ET. EDT is UTC-4, so 09:45 UTC starts it and it
    # lands by ~09:55 UTC = 5:55am ET. The later entries are only fallbacks for
    # when GitHub's scheduler drops the first one; they no-op if it already went.
    - cron: "45 9 * * 1-5"     # ~5:45am ET  <- the one that should win
    - cron: "12 10 * * 1-5"    # ~6:12am ET
    - cron: "41 10 * * 1-5"    # ~6:41am ET

permissions:
  contents: write

# A run that hangs must never block the next one. On 25 Aug a run sat for six
# hours and everything queued behind it.
concurrency:
  group: dailyphil
  cancel-in-progress: true

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt

      - name: Skip if today already went out
        id: guard
        run: |
          TODAY=$(date -u +%F)
          if [ -f data/last_posted.txt ] && [ "$(cat data/last_posted.txt)" = "$TODAY" ] \
             && [ "${{ inputs.dry_run }}" != "true" ]; then
            echo "already posted $TODAY — skipping"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Collect candidates
        if: steps.guard.outputs.skip != 'true'
        timeout-minutes: 8
        run: python src/feeds.py

      - name: Sort into sections and post
        if: steps.guard.outputs.skip != 'true'
        timeout-minutes: 15
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python src/digest.py --preview
          else
            python src/digest.py --post
          fi
        env:
          SLACK_GIFTS: ${{ secrets.SLACK_GIFTS }}
          SLACK_WWW: ${{ secrets.SLACK_WWW }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_DAILY_BUDGET: "10"

      - name: Record that today went out
        if: success() && steps.guard.outputs.skip != 'true' && inputs.dry_run != true
        run: date -u +%F > data/last_posted.txt

      - name: Persist state
        if: always()
        run: |
          git config user.name "dailyphil-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ || true
          git diff --staged --quiet || git commit -m "state: $(date -u +%F)"
          git pull --rebase --autostash -q || true
          git push || true

      - name: Tell Slack if the run failed
        if: failure()
        run: |
          curl -s -X POST -H 'Content-Type: application/json' \
            -d "{\"text\":\":warning: Daily Phil watcher run failed — <https://github.com/LevelThreeLabsO/eJP-Daily-Watcher/actions/runs/${{ github.run_id }}|see the log>\"}" \
            "${{ secrets.SLACK_GIFTS }}" || true
