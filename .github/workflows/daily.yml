name: Daily Phil watchers

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the digest to the log without posting to Slack"
        type: boolean
        default: true
  schedule:
    # 09:15 UTC ≈ 5:15am ET, weekdays — before the Daily Phil is assembled.
    - cron: "15 9 * * 1-5"

permissions:
  contents: write

concurrency:
  group: dailyphil
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt

      - name: Collect candidates
        run: python src/feeds.py

      - name: Sort into sections and post
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python src/digest.py --preview
          else
            python src/digest.py --post
          fi
        env:
          SLACK_GIFTS: ${{ secrets.SLACK_GIFTS }}
          SLACK_WWW: ${{ secrets.SLACK_WWW }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_DAILY_BUDGET: "10"

      - name: Persist state
        run: |
          git config user.name "dailyphil-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ || true
          git diff --staged --quiet || git commit -m "state: $(date -u +%F)"
          git pull --rebase --autostash -q || true
          git push || true
