# Sources the eJP newswire polls each run. Data, not logic — poll.py re-reads this
# file every run, so an edit takes effect on the next tick.
#
# The list is not a guess. It is what eJewishPhilanthropy's own coverage points at,
# plus the gaps found by measuring what the previous collector missed:
#
#   * Local and regional Jewish papers. 8 of 11 items missed in one audited week were a
#     local institution hosting something — a JCC speaker, a federation program, a film
#     festival opening. National feeds never carry those; Cleveland Jewish News, J. Bay
#     Area and Washington Jewish Week do.
#   * Haredi outlets. The Satmar philanthropist who pledged $1M for yeshiva legal aid
#     appeared in no mainstream feed. Matzav, Yeshiva World, Yated and Collive carry
#     that world and nothing else did.
#   * Diaspora. 6.2% of real Major Gifts items and 3.3% of What We're Watching are
#     outside Israel and the US — a Vancouver bequest, a London gala, a Buenos Aires
#     commemoration. Australian, European, South African and Spanish-language sources
#     are here for those.
#
# Per-source fields:
#   key             short unique id; the dedup + status label
#   outlet          how it appears in Slack
#   method          rss | gnews
#   url             rss: the feed. gnews: the query.
#   threshold       score needed from this source. Omit for the stream default.
#   window_minutes  freshness window; must exceed the 15-minute dispatch interval.
#
# Feed status verified live 2026-09-02. Re-run `poll.py --audit` monthly: a dead feed
# answers HTTP 200 and serves a web page, so nothing else will ever notice.

max_items: 12

# Publish-age cap: an item posts only if we have not seen it AND it was published within
# this many minutes. Dedup does the novelty work, so this only stops old news being
# dredged up on a first run or after an outage.
#
# 240, not the Circuit newswire's 30. Half this source list is Google News searches, and
# a search surfaces things published hours earlier — at 45 minutes every single query
# returned "0 in window / 100 in feed" and the Major Gifts channel got nothing at all.
max_age_minutes: 240
default_window_minutes: 180

