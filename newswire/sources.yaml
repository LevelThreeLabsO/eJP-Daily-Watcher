  # ══ Standing searches. Google News, scoped by query rather than site, because
  #    a gift to a secular university is covered by that university's own newsroom
  #    and by local business press, not by any feed worth subscribing to.
  #    These include Rachel's own daily searches verbatim.
  - key: q00
    outlet: Google News
    method: gnews_entity
    window_minutes: 360
    query: 'philanthropy gift donation'
    threshold: 5
  - key: q01
    outlet: Google News
    method: gnews_entity
    window_minutes: 360
    query: '"major gift" OR "largest gift" OR "record gift"'
    threshold: 5
  - key: q02
    outlet: Google News
    method: gnews_entity
    window_minutes: 360
    query: '(donates OR donated OR gifts OR gifted) to (university OR hospital OR museum OR college)'
    threshold: 5
  - key: q03
