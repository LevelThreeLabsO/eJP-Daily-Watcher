  # ══ Philanthropy trade press — carries the 57% of Major Gifts that is general philanthropy 
  - key: chronicle_of_philanthrop
    outlet: Chronicle of Philanthropy
    method: rss
    url: https://www.philanthropy.com/feed
  # Disabled, not deleted, so nobody re-adds it in six months without the finding.
  # Every documented feed path (/feeds/rss/news, /rss/news.xml, /feed, /rss, /news/rss)
  # answers 200 with an HTML page, and Google News indexes the domain zero times — a
  # site: search returns nothing at all, as does the masthead as a phrase. There is no
  # route to this outlet from here. Its grant announcements are reachable through Candid
  # below, which is the same organisation.
  - key: philanthropy_news_digest
    outlet: Philanthropy News Digest
    method: rss
    url: https://philanthropynewsdigest.org/feeds/rss/news
    enabled: false

  - key: candid
    outlet: Candid
    method: gnews
    url: candid.org
    query: "(grant OR grants OR gift OR foundation OR philanthropy OR nonprofit)"
    publisher: [Candid, candid.org, learning.candid.org, Philanthropy News Digest]
  - key: nonprofit_quarterly
    outlet: Nonprofit Quarterly
    method: rss
    url: https://nonprofitquarterly.org/feed/
  # news.rss is a 404 and /news/feed a 403 — Devex put its feeds behind the paywall.
  - key: devex
    outlet: Devex
    method: gnews
    url: devex.com
    query: "(philanthropy OR foundation OR donor OR grant OR gift)"
    publisher: [Devex, devex.com]

