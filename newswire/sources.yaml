  # ══ The 990 watchlist: institutions, and their announcements ═══════════════
  #
  # Generated from the 1,292 Jewish nonprofits with $1M+ revenue that the lead
  # engine built out of the IRS Business Master File. One query per organization
  # would be 1,292 sources polled every fifteen minutes; Google honours a long
  # disjunction, so each of these carries ten organizations crossed with giving
  # vocabulary. Regenerate with tools/build_org_queries.py, which also documents
  # why the names need cleaning before they are searchable.
  #
  # Measured over seven days before adding: 458 items, 30 scoring as gifts —
  # "Birthright Israel Foundation celebrates 25 years with $220M", "La Jolla gala
  # raises $2 million for Jewish Family Service", "Jewish Federation of Southern
  # New Jersey announces the establishment of...". Two of the twelve returned
  # nothing; their batches hold names too institutional to appear in news.
  # 120 organizations from the 990 watchlist, in 12 queries.
  # Regenerate: python3 tools/build_org_queries.py --top 120
  - key: org00
    outlet: Google News
    method: gnews_entity
    window_minutes: 720
    threshold: 4
    query: "(\"Claims Conference\" OR \"Hebrew University of Jerusalem\" OR \"Jewish Community Federation of S F\" OR \"Jewish Agency for Israel\" OR \"Yeshiva University\" OR \"Jewish Federations of North America\" OR \"JDC\" OR \"National Jewish Health\" OR \"Combined Jewish Philanthropies of Greater Boston\" OR \"UJA-Federation of New York\") (gift OR donation OR grant OR endowment OR bequest OR pledge OR donates OR donated OR gave OR campaign)"
  - key: org01
    outlet: Google News
    method: gnews_entity
    window_minutes: 720
    threshold: 4
    query: "(\"Jewish Federation of Metropolitan Chicago\" OR \"Jewish Board of Family & Childrens\" OR \"Jewish National Fund\" OR \"Jewish Community Foundation of San Diego\" OR \"United States Holocaust Memorial Council\" OR \"Jewish Community Fdn of the Jewish\" OR \"Jewish United Fund of Metropolitan Chicago\" OR \"Hadassah\" OR \"Jewish Federation of Cleveland\" OR \"Greater Miami Jewish Federation\") (gift OR donation OR grant OR endowment OR bequest OR pledge OR donates OR donated OR gave OR campaign)"
  - key: org02
    outlet: Google News
    method: gnews_entity
    window_minutes: 720
    threshold: 4
    query: "(\"Anti-Defamation League\" OR \"Jewish Community Foundation of Greater Metrowest\" OR \"American Jewish Committee\" OR \"Parker Jewish Institute for Health Care\" OR \"Hebrew Home for the Aged\" OR \"Jewish Federation of Greater Atlanta\" OR \"Rosalind and Joseph Gurwin Jewish Geriatric\" OR \"Ohel Childrens Home and Family Services\" OR \"American Friends of the Hebrew University\" OR \"92nd Street Y\") (gift OR donation OR grant OR endowment OR bequest OR pledge OR donates OR donated OR gave OR campaign)"
  - key: org03
    outlet: Google News
    method: gnews_entity
